# Reverse proxy for the Orma stack.
#   orma.tomish.fr   -> astro:4321  (public site)
#   strapi.tomish.fr -> strapi:1337 (Strapi admin + API)
# HTTP (80) is redirected to HTTPS (443). Let's Encrypt certificates are
# obtained and renewed automatically by mod_md and kept in the "apache_md" volume.

ServerRoot "/usr/local/apache2"
Listen 80
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule headers_module modules/mod_headers.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule md_module modules/mod_md.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User daemon
Group daemon

ServerName orma.tomish.fr
ServerAdmin ${ACME_EMAIL}
ServerTokens Prod
ServerSignature Off
TraceEnable Off

ErrorLog /proc/self/fd/2
LogLevel warn md:info
LogFormat "%{Host}i %a %t \"%r\" %>s %b %D \"%{User-Agent}i\"" vhost
CustomLog /proc/self/fd/1 vhost

Protocols h2 http/1.1

# --- Let's Encrypt (mod_md) -------------------------------------------------
MDCertificateAgreement accepted
MDContactEmail ${ACME_EMAIL}
MDCertificateAuthority ${ACME_CA}
MDStoreDir /usr/local/apache2/md
# Permanent HTTP -> HTTPS redirect + HSTS for the managed domains
MDRequireHttps permanent
MDomain orma.tomish.fr
MDomain strapi.tomish.fr

# --- TLS ----------------------------------------------------------------------
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLHonorCipherOrder off
SSLSessionTickets off
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)

# --- Proxy --------------------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On
# Generous timeout for media uploads in the Strapi admin
ProxyTimeout 300

# Catch-all for unknown hosts (first vhost = default): refuse
<VirtualHost *:80>
    ServerName default.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

# Port 80 vhosts: only serve ACME challenges and the redirect to HTTPS (mod_md)
<VirtualHost *:80>
    ServerName orma.tomish.fr
</VirtualHost>

<VirtualHost *:80>
    ServerName strapi.tomish.fr
</VirtualHost>

<VirtualHost *:443>
    ServerName orma.tomish.fr
    SSLEngine on

    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPass        / http://astro:4321/
    ProxyPassReverse / http://astro:4321/
</VirtualHost>

<VirtualHost *:443>
    ServerName strapi.tomish.fr
    SSLEngine on

    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # upgrade=websocket: needed by the admin while Strapi runs in "develop" mode
    ProxyPass        / http://strapi:1337/ upgrade=websocket
    ProxyPassReverse / http://strapi:1337/
</VirtualHost>
